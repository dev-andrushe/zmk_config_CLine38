description: Rate-limited Ctrl-wheel zoom, with horizontal gestures passed onward
compatible: "zmk,input-processor-slow-zoom"

properties:
  "#input-processor-cells":
    type: int
    const: 0
  track-remainders:
    type: boolean
  layer:
    type: int
    required: true
  counts-per-step:
    type: int
    default: 64
  min-interval-ms:
    type: int
    default: 200
  ctrl-settle-ms:
    type: int
    default: 40
