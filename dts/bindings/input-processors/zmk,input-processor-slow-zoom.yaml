description: Rate-limited Ctrl-wheel zoom, with left and right behavior bindings
compatible: "zmk,input-processor-slow-zoom"

properties:
  "#input-processor-cells":
    type: int
    const: 0
  track-remainders:
    type: boolean
  layer:
    type: int
    required: true
  bindings:
    type: phandle-array
    required: true
    description: Left and right behaviors, in that order
  counts-per-step:
    type: int
    default: 64
  min-interval-ms:
    type: int
    default: 200
  ctrl-settle-ms:
    type: int
    default: 40
