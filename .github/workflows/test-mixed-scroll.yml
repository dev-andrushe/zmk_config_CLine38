name: Pointer input logic
on:
  push:
    paths: ["src/**", "tests/**", "scripts/**", "cmake/**", "include/**", "CMakeLists.txt", "Kconfig", ".github/workflows/test-mixed-scroll.yml"]
  pull_request:
    paths: ["src/**", "tests/**", "scripts/**", "cmake/**", "include/**", "CMakeLists.txt", "Kconfig", ".github/workflows/test-mixed-scroll.yml"]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Test direction lock, scroll continuity and navigation rearming
        run: |
          cc -std=c11 -Wall -Wextra -Werror -fsanitize=undefined -o /tmp/mixed-scroll-test tests/mixed_scroll_test.c
          /tmp/mixed-scroll-test
          cc -std=c11 -Wall -Wextra -Werror -fsanitize=undefined -o /tmp/reference-scroll-test tests/reference_scroll_test.c
          /tmp/reference-scroll-test
      - name: Test Retro Tap pointer activation and source guard
        run: |
          cc -std=c11 -Wall -Wextra -Werror -fsanitize=undefined -o /tmp/retro-pointer-test tests/retro_pointer_test.c
          /tmp/retro-pointer-test
          python -m unittest discover -s tests -p 'test_*.py'
      - name: Test first-key LT and MT holds with pinned ZMK event dispatch
        run: python tests/run_hold_tap_regression.py
      - name: Test Ctrl plus Layer8 and complete gesture HID transactions
        run: python tests/run_ctrl8_regression.py
      - name: Test slow zoom step size, rate limit and horizontal gestures
        run: |
          cc -std=c11 -Wall -Wextra -Werror -fsanitize=undefined -o /tmp/slow-zoom-test tests/slow_zoom_test.c
          /tmp/slow-zoom-test
          cc -std=c11 -Wall -Wextra -Werror -fsanitize=undefined -o /tmp/slow-zoom-inertia-test tests/slow_zoom_inertia_test.c
          /tmp/slow-zoom-inertia-test
